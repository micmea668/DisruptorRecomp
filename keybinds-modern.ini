# Disruptor modern keyboard layout. The launcher copies this file next to the
# executable only for modern-control sessions.
#
# Game actions:
#   W/S forward/back, A/D strafe, arrows original movement/menu fallback
#   Return fire/confirm, Space jump/cancel, F psionic attack, E use
#   Q choose weapon, R choose psionic, Tab map, P pause

[player1]
up        = W
down      = S
left      = Left
right     = Right
cross     = Return
circle    = Space
square    = F
triangle  = E
l1        = Q
r1        = R
l2        = A
r2        = D
l3        = None
r3        = None
start     = P
select    = Tab
ls_up     = None
ls_down   = None
ls_left   = None
ls_right  = None
rs_up     = None
rs_down   = None
rs_left   = None
rs_right  = None

[player2]
up        = None
down      = None
left      = None
right     = None
cross     = None
circle    = None
square    = None
triangle  = None
l1        = None
r1        = None
l2        = None
r2        = None
l3        = None
r3        = None
start     = None
select    = None
ls_up     = None
ls_down   = None
ls_left   = None
ls_right  = None
rs_up     = None
rs_down   = None
rs_left   = None
rs_right  = None
