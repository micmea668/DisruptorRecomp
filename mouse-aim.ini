# Disruptor mouse camera controls.
# Higher sensitivity moves farther for the same mouse movement.
# Accepted range: 0.005 to 2.000. Restart the game after editing.
horizontal_sensitivity = 0.080

# Set to true only if left/right movement feels reversed.
invert_horizontal = false

# Experimental host-side vertical camera and weapon aim. These tuning values
# are used when vertical look is enabled by the launcher or in-game menu.
vertical_sensitivity = 0.080

# Set to true only if up/down movement feels reversed.
invert_vertical = false
